<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bina Faturaları</title>
<meta name="theme-color" content="#181d22">
<link rel="manifest" href="./manifest.json">

<style>
  :root{
    --c-elektrik:#e3a83c; --c-su:#3f8fd1; --c-dogalgaz:#d9663c;
    --c-unpaid:#d9534f; --c-unpaid-bg: rgba(217, 83, 79, 0.15);
    --radius:14px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --custom-row-bg: var(--card); --custom-text-color: var(--text); --custom-subtext-color: var(--muted);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
  #app{min-height:100%; padding-bottom: calc(24px + var(--safe-bottom));}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); padding: calc(14px + var(--safe-top)) 16px 10px 16px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;
  }
  .topbar h1{font-size:19px; margin:0; font-weight:600; flex:1; letter-spacing:.2px;}
  .iconbtn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .backbtn{background:none; border:none; color:var(--accent); font-size:16px; padding:6px 4px 6px 0; cursor:pointer; display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .content{padding:14px 16px 40px 16px;}
  .header-row{
    display:flex; align-items:stretch; gap:6px; position:sticky; top:50px; z-index:15;
    background:var(--bg); padding:6px 0 10px 0; margin-bottom:6px;
  }
  .odeme-tab{
    background:var(--card); border:1.5px solid var(--accent); color:var(--accent);
    border-radius:12px; padding:0 12px; font-size:13px; font-weight:700; letter-spacing:.4px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .odeme-tab:active{background:color-mix(in srgb, var(--accent) 14%, transparent);}
  .tab-btn-col{display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
  .tab-btn-col .odeme-tab{padding:0 9px; font-size:10.5px; letter-spacing:.2px; border-radius:9px; flex:1; min-height:26px; white-space:nowrap;}
  .kart-havuzu-btn{background:var(--accent) !important; color:#fff !important;}
  .kart-havuzu-btn:active{opacity:.85;}
  .month-switch{
    flex:1; display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:4px; position:relative; overflow: hidden;
  }
  .month-switch .m-label{
    font-size:14px; font-weight:600; text-align:center; flex:1; cursor:pointer; 
    display:flex; align-items:center; justify-content:space-between; padding:0 8px; position: relative; height: 32px;
  }
  .month-switch .m-label span{display:block; font-size:10.5px; font-weight:400; color:var(--muted);}
  .month-nav{background:none; border:none; color:var(--text); font-size:20px; width:28px; height:28px; border-radius:8px; cursor:pointer; flex-shrink:0; z-index: 2; position: relative;}
  .month-nav:active{background:var(--border);}
  .theme-quick-btn {
    background:var(--card); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .calendar-picker-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; display: block; }
  .ledger-wrap{border:1.5px solid var(--accent); border-radius:10px; overflow:hidden; margin-bottom:20px;}
  table.ledger{width:100%; border-collapse:collapse; table-layout:fixed;}
  table.ledger th{
    background:var(--card); color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.3px;
    padding:8px 6px; border-bottom:1.5px solid var(--accent); text-align:left;
  }
  
  table.ledger th.daire-th{color:var(--accent); text-align:center; width:65px;}
  table.ledger th.tarih-th{text-align:center; width:78px;}
  table.ledger th.toplam-th{text-align:right; width:72px;}
  
  /* Kartlar tablosu özel sütun genişlikleri */
  table.ledger.kart-ledger th.kart-isim-th { width: 55px; text-align: left; }
  table.ledger.kart-ledger th.kart-tarih-th { width: 68px; text-align: center; }
  table.ledger.kart-ledger th.kart-ekstre-th { width: 70px; text-align: right; }
  table.ledger.kart-ledger th.kart-toplam-th { width: 70px; text-align: right; }
  table.ledger.kart-ledger th.kart-genel-th { width: 75px; text-align: right; }

  table.ledger td{border:1px solid var(--border); padding:0; font-size:13px; background: var(--custom-row-bg);}
  table.ledger tr.k-row:active{background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .daire-cell, .grup-cell{
    text-align:center; vertical-align:middle; cursor:pointer; font-size:13px; font-weight:700; 
    color:var(--accent); border-right:1.5px solid var(--accent) !important; padding: 2px 4px !important; word-break: break-word;
  }
  tr.daire-start td{border-top:2px solid var(--accent) !important;}
  .grup-cell .tap-hint, .daire-cell .tap-hint{display:block; font-size:8px; font-weight:400; color:var(--custom-subtext-color); margin-top:2px;}
  .kalem-label-cell{padding:5px 4px 5px 6px !important;}
  .kalem-label-cell .lbl{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--custom-subtext-color);}
  .kalem-label-cell .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .kalem-tarih-cell{text-align:center; padding:5px 2px !important; font-size:10px; color:var(--custom-subtext-color); font-variant-numeric: tabular-nums; white-space:nowrap;}
  .kalem-val-cell{text-align:right; padding:5px 6px 5px 2px !important; font-variant-numeric: tabular-nums; font-size:12.5px; color: var(--custom-text-color);}
  .unpaid-row { background: var(--c-unpaid-bg) !important; }
  .unpaid-text { color: var(--c-unpaid) !important; font-weight: 600; }
  .val-neg { color: #4caf50 !important; font-weight: 700; }
  .toplam-cell{
    text-align:right; vertical-align:middle; font-weight:700; color:var(--accent);
    font-variant-numeric: tabular-nums; border-left:1.5px solid var(--accent) !important; font-size:12px; padding-right: 4px !important;
  }
  .apt-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .apt-title-row h2{margin:0; font-size:18px;}
  .sticky-top-block { position: sticky; top: 50px; z-index: 15; background: var(--bg); padding-top: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .excel-paste-wrap { background: var(--card); border: 1.5px dashed var(--accent); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; }
  .excel-paste-wrap textarea { width: 100%; height: 70px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; font-family: monospace; resize: vertical; }
  .btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .btn.secondary{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn.danger{background:var(--c-unpaid); color:#fff;}
  .btn.success{background:#2e7d32; color:#fff;}
  .btn:active{opacity:.85;}
  .bulk-bar { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px; }
  .bulk-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .excel-wrap{border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:2px;}
  table.excel-table{width:100%; border-collapse:collapse; table-layout:fixed;}
  table.excel-table th{
    background:var(--card); color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.2px;
    padding:6px 4px; border:1px solid var(--border); text-align:left;
  }
  table.excel-table td{border:1px solid var(--border); padding:0; background:var(--bg); vertical-align:middle;}
  table.excel-table th.ex-chk, table.excel-table td.ex-chk{width:24px; text-align:center;}
  table.excel-table th.ex-tarih, table.excel-table td.ex-tarih{width:68px;}
  table.excel-table th.ex-tutar, table.excel-table td.ex-tutar{width:68px;}
  table.excel-table th.ex-ay, table.excel-table td.ex-ay{width:74px;}
  table.excel-table th.ex-sil, table.excel-table td.ex-sil{width:24px;}
  table.excel-table th.ex-kart, table.excel-table td.ex-kart{width:78px;}
  table.excel-table td.ex-kart select{ width:100%; border:none; background:transparent; color:var(--text); font-size:10.5px; padding:6px 2px; font-family:inherit; }
  .manual-kart-form{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .manual-kart-form input, .manual-kart-form select{ background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 6px; font-size:11.5px; font-family:inherit; min-width:0; }
  table.excel-table td input[type=text]{ width:100%; border:none; background:transparent; color:var(--text); font-size:11.5px; padding:6px 4px; font-family:inherit; }
  table.excel-table td input[type=text]:focus{outline:1.5px solid var(--accent); outline-offset:-1.5px;}
  table.excel-table td.ex-tutar input{text-align:right;}
  table.excel-table td.ex-ay{font-size:9.5px; color:var(--muted); text-align:center; padding:4px 2px;}
  table.excel-table td.ex-ay-warn{color:var(--c-unpaid); font-weight:600;}
  table.excel-table td.ex-chk input{margin:0;}
  table.excel-table .delbtn{background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:5px 0; width:100%;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:26px 10px;}
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ background:var(--bg2); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + var(--safe-bottom)) 16px; max-height:82vh; overflow-y:auto; }
  @media (min-width: 720px){ .modal-sheet{ max-width:640px; border-radius:18px; margin-bottom:24px; } }
  .modal-sheet h3{margin:0 0 12px 0; font-size:17px;}
  .modal-close{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
  .code-group{margin-bottom:14px;}
  .code-group .gh{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; margin-bottom:6px;}
  .code-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:5px 6px 5px 12px; font-size:12.5px; margin:0 6px 6px 0; font-variant-numeric: tabular-nums; }
  .code-chip button{background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 4px;}
  .code-add{display:flex; gap:6px; margin-top:4px;}
  .code-add input{flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px; font-size:13px;}
  .color-picker-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .color-picker-row label { font-size: 13px; font-weight: 500; }
  .color-picker-row input[type=color] { width: 36px; height: 32px; border: none; border-radius: 6px; background: none; cursor: pointer; }
  .apt-name-edit { display: flex; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .apt-name-edit input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'binaFaturalari_v4';

// ==================================================================================
// FIREBASE BULUT EŞİTLEME AYARLARI
// Kendi Firebase projenizin bilgilerini console.firebase.google.com üzerinden
// (Proje Ayarları > Genel > "Web uygulaması" bölümünden) alıp aşağıya yapıştırın.
// Doldurmazsanız uygulama sadece bu cihazda (localStorage) çalışmaya devam eder.
// ==================================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBZ8wHGSq_dQWfV6VRvdWSo16wl9VlfI9M",
  authDomain: "faturalar-f0c05.firebaseapp.com",
  projectId: "faturalar-f0c05",
  storageBucket: "faturalar-f0c05.firebasestorage.app",
  messagingSenderId: "305847305937",
  appId: "1:305847305937:web:a1b8a65861a1df6d08e7f0"
};
const FIREBASE_DOC_PATH = ['binaFaturalari', 'veri']; // Firestore: koleksiyon/döküman
let fbDb = null;
let fbEnabled = false;
let fbPushTimer = null;

function initFirebaseIfConfigured(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('BURAYA_') === 0) return;
  if(typeof firebase === 'undefined') return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    fbEnabled = true;
    updateSyncBadge('Bulut ile eşitleniyor…');
    cloudPullIfNewer();
  }catch(e){ console.error('Firebase başlatılamadı:', e); updateSyncBadge('Firebase başlatılamadı'); }
}

function getLocalTs(){ return parseInt(localStorage.getItem(STORAGE_KEY + '_ts') || '0', 10); }
function setLocalTs(ts){ localStorage.setItem(STORAGE_KEY + '_ts', String(ts)); }

function updateSyncBadge(msg){
  const el = document.getElementById('syncBadge');
  if(el) el.textContent = msg;
}

function mergeLoadedState(parsed){
  const fresh = defaultState();
  const loadedState = Object.assign(fresh, parsed, {
    currentMonth: nowMonthKey(),
    apartments: Object.assign(fresh.apartments, parsed.apartments || {}),
    payments: parsed.payments || [],
    customTabs: parsed.customTabs || [],
    digerKalemler: parsed.digerKalemler || [],
    kartlar: parsed.kartlar || [],
    kartPayments: parsed.kartPayments || []
  });
  sortPaymentsByDate(loadedState.payments);
  sortPaymentsByDate(loadedState.kartPayments);
  return loadedState;
}

function cloudPush(){
  if(!fbEnabled || !fbDb) return;
  const ts = Date.now();
  fbDb.collection(FIREBASE_DOC_PATH[0]).doc(FIREBASE_DOC_PATH[1]).set({ json: JSON.stringify(state), ts })
    .then(() => { setLocalTs(ts); updateSyncBadge('Bulutta güncel ✓ (' + new Date(ts).toLocaleTimeString('tr-TR') + ')'); })
    .catch(e => { console.error('Bulut gönderim hatası:', e); updateSyncBadge('Bulut gönderim hatası'); });
}

function cloudPushDebounced(){
  if(!fbEnabled) return;
  clearTimeout(fbPushTimer);
  fbPushTimer = setTimeout(cloudPush, 1200);
}

function cloudPullIfNewer(){
  if(!fbEnabled || !fbDb) return;
  fbDb.collection(FIREBASE_DOC_PATH[0]).doc(FIREBASE_DOC_PATH[1]).get().then(snap => {
    if(!snap.exists){ cloudPush(); return; }
    const d = snap.data();
    const localTs = getLocalTs();
    if(d.ts && d.ts > localTs){
      try{
        state = mergeLoadedState(JSON.parse(d.json));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        setLocalTs(d.ts);
        applyTheme(); render();
        updateSyncBadge('Bulut ile eşitlendi ✓ (' + new Date(d.ts).toLocaleTimeString('tr-TR') + ')');
      }catch(e){ console.error('Bulut verisi okunamadı:', e); updateSyncBadge('Bulut verisi okunamadı'); }
    } else {
      cloudPush();
    }
  }).catch(e => { console.error('Bulut okuma hatası:', e); updateSyncBadge('Bulut bağlantı hatası'); });
}

function cloudPullManual(){
  if(!fbEnabled || !fbDb){ alert('Firebase yapılandırılmadı.'); return; }
  fbDb.collection(FIREBASE_DOC_PATH[0]).doc(FIREBASE_DOC_PATH[1]).get().then(snap => {
    if(!snap.exists){ alert('Bulutta henüz veri yok.'); return; }
    const d = snap.data();
    try{
      state = mergeLoadedState(JSON.parse(d.json));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setLocalTs(d.ts || Date.now());
      applyTheme(); render();
      updateSyncBadge('Buluttan indirildi ✓');
      alert('Bulut verisi bu cihaza yüklendi.');
    }catch(e){ alert('Bulut verisi okunamadı.'); }
  }).catch(e => alert('Bulut okuma hatası: ' + e.message));
}

const KALEMLER = [
  {id:'elektrik', ad:'Elektrik', renk:'var(--c-elektrik)'},
  {id:'su', ad:'Su', renk:'var(--c-su)'},
  {id:'dogalgaz', ad:'Doğalgaz', renk:'var(--c-dogalgaz)'}
];
const AY_ADI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const AY_ADI_MAP = {
  'ocak':1,'oca':1,'şubat':2,'subat':2,'şub':2,'sub':2,'mart':3,'mar':3,'nisan':4,'nis':4,
  'mayıs':5,'mayis':5,'may':5,'haziran':6,'haz':6,'temmuz':7,'tem':7,'ağustos':8,'agustos':8,'ağu':8,'agu':8,
  'eylül':9,'eylul':9,'eyl':9,'ekim':10,'eki':10,'kasım':11,'kasim':11,'kas':11,'aralık':12,'aralik':12,'ara':12
};

function parseFullDateKey(raw){
  if(!raw) return '9999-99-99';
  raw = String(raw).trim().toLowerCase();
  let m = raw.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  
  m = raw.match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})/);
  if(m){ let y = +m[3]; if(y<100) y+=2000; return y + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0'); }
  
  m = raw.match(/^(\d{1,2})\s*[.\-\/]?\s*([a-zçğıöşü]+)\s*[.\-\/]?\s*(\d{4})/i);
  if(m){
    const ayNo = AY_ADI_MAP[m[2]];
    if(ayNo) return m[3] + '-' + String(ayNo).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  }
  return raw;
}

function sortPaymentsByDate(paymentsArray) {
  if(!paymentsArray || !Array.isArray(paymentsArray)) return;
  paymentsArray.sort((a, b) => parseFullDateKey(a.tarih).localeCompare(parseFullDateKey(b.tarih)));
}

function nowMonthKey(){
  const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0');
}

function defaultState(){
  const apartments = {};
  for(let i=1;i<=7;i++){ apartments[i] = { name: i + '. Daire', codes: {elektrik:[], su:[], dogalgaz:[]} }; }
  return {
    theme: 'koyu', customColor: '#c9803f', rowBgColor: '#1e252b', textColor: '#eef1f4', subtextColor: '#93a0a9',
    currentMonth: nowMonthKey(), apartments, payments: [], customTabs: [], digerKalemler: [], kartlar: [], kartPayments: []
  };
}

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const def = defaultState();
    const loadedState = Object.assign(def, parsed, {
      currentMonth: nowMonthKey(),
      apartments: Object.assign(def.apartments, parsed.apartments || {}),
      payments: parsed.payments || [],
      customTabs: parsed.customTabs || [],
      digerKalemler: parsed.digerKalemler || [],
      kartlar: parsed.kartlar || [],
      kartPayments: parsed.kartPayments || []
    });
    
    sortPaymentsByDate(loadedState.payments);
    sortPaymentsByDate(loadedState.kartPayments);
    return loadedState;
  }catch(e){ return defaultState(); }
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); setLocalTs(Date.now()); cloudPushDebounced(); }

const THEMES = {
  koyu:  {'--bg':'#14181c','--bg2':'#1b2126','--card':'#1e252b','--text':'#eef1f4','--muted':'#93a0a9','--border':'#2b333a','--accent':'#d98f4c'},
  acik:  {'--bg':'#f4f1ea','--bg2':'#ffffff','--card':'#ffffff','--text':'#242220','--muted':'#7a7468','--border':'#e3ddce','--accent':'#b5652f'},

function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function parseTutar(raw){
  if(raw===undefined || raw===null) return 0;
  let s = String(raw).replace(/[₺TL\s]/gi,'').trim();
  if(s==='') return 0;
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if(hasDot && hasComma){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(hasComma){ s = s.replace(',', '.'); }
  const v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}

function formatTutar(v){ return (v||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' \u20ba'; }

function exportRowsToExcel(rows, sheetName, filename){
  if(typeof XLSX === 'undefined'){ alert('Excel motoru yüklenemedi. İnternet bağlantınızı kontrol edin.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

function readExcelFile(file, callback){
  if(typeof XLSX === 'undefined'){ alert('Excel motoru yüklenemedi. İnternet bağlantınızı kontrol edin.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, {defval:''});
      callback(rows);
    }catch(err){ alert('Excel dosyası okunamadı: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function splitKodlar(raw){
  return String(raw||'').split(',').map(s => s.trim()).filter(Boolean);
}

function formatKisaTarih(raw){
  if(!raw) return '—';
  raw = raw.trim();
  let m = raw.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return String(m[3]).padStart(2,'0') + ' ' + String(m[2]).padStart(2,'0') + ' ' + m[1];
  m = raw.match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; return String(m[1]).padStart(2,'0') + ' ' + String(m[2]).padStart(2,'0') + ' ' + y; }
  return raw.length > 10 ? raw.slice(0, 10) : raw;
}

function parseAyKeyFromTarih(raw){
  if(!raw) return null;
  raw = String(raw).trim().toLowerCase();
  if(raw === '') return null;
  let m = raw.match(/^(\d{4})[-.\/](\d{1,2})/);
  if(m) return m[1] + '-' + String(m[2]).padStart(2,'0');
  m = raw.match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; return y + '-' + String(m[2]).padStart(2,'0'); }
  m = raw.match(/^(\d{1,2})\s*[.\-\/]?\s*([a-zçğıöşü]+)\s*[.\-\/]?\s*(\d{4})/i);
  if(m){ const ayNo = AY_ADI_MAP[m[2]]; if(ayNo) return m[3] + '-' + String(ayNo).padStart(2,'0'); }
  m = raw.match(/^([a-zçğıöşü]+)\s+(\d{4})/i);
  if(m){ const ayNo = AY_ADI_MAP[m[1]]; if(ayNo) return m[2] + '-' + String(ayNo).padStart(2,'0'); }
  return null;
}

function parseImportBlock(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  for(const line of lines){
    let parts = line.split('\t').map(p=>p.trim()).filter(p=>p!=='');
    if(parts.length < 3){ parts = line.split(/\s{2,}/).map(p=>p.trim()).filter(p=>p!==''); }
    let tarih='', aciklama='', tutar='';
    if(parts.length >= 3){
      tarih = parts[0]; tutar = parts[parts.length-1]; aciklama = parts.slice(1, parts.length-1).join(' ');
    } else {
      const amtMatch = line.match(/([\d.,\-]+)\s*(?:₺|TL)?\s*$/i);
      tutar = amtMatch ? amtMatch[1] : '';
      let rest = amtMatch ? line.slice(0, amtMatch.index).trim() : line;
      const dateMatch = rest.match(/^(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}|\d{4}-\d{1,2}-\d{1,2}|\S+\s+\S+\s+\S+\s+\S+|\S+\s+\S+\s+\S+)/);
      if(dateMatch){ tarih = dateMatch[1]; rest = rest.slice(dateMatch[1].length).trim(); }
      aciklama = rest;
    }
    if(!tarih && !aciklama && !tutar) continue;
    rows.push({tarih, aciklama, tutar});
  }
  return rows;
}

function normalizeTr(s){ return String(s||'').toLowerCase().replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c').trim(); }

function findPaymentForCodeInMonth(code, monthKey){
  if(!code) return null;
  const normCode = String(code).replace(/\s+/g,'').toLowerCase();
  for(let i = state.payments.length - 1; i >= 0; i--){
    const p = state.payments[i];
    const pMonth = parseAyKeyFromTarih(p.tarih);
    if(pMonth === monthKey && p.aciklama){
      const normAciklama = String(p.aciklama).replace(/\s+/g,'').toLowerCase();
      if(normAciklama.includes(normCode)) return { tarih: formatKisaTarih(p.tarih), tutar: p.tutar };
    }
  }
  return null;
}

function getDaireKalemVal(daireId, kalemId, monthKey){
  const apt = state.apartments[daireId];
  if(!apt || !apt.codes || !apt.codes[kalemId]) return null;
  for(const code of apt.codes[kalemId]){
    const res = findPaymentForCodeInMonth(code, monthKey);
    if(res !== null) return res;
  }
  return null;
}

function getValForCodes(codes, monthKey){
  if(!codes) return null;
  for(const code of codes){
    const res = findPaymentForCodeInMonth(code, monthKey);
    if(res !== null) return res;
  }
  return null;
}

// YENİLENMİŞ KART ÖZET FONKSİYONU
function getKartAylikOzet(kartObj, monthKey){
  if(!kartObj || !kartObj.ad) return null;
  const normKart = normalizeTr(kartObj.ad);
  const kesimGunu = kartObj.kesimGunu || 15;
  
  let [y, m] = monthKey.split('-').map(Number);
  
  // 1. Ekstre Sınırı: Bu ayın kesim tarihi (Örn: 30 Eylül)
  const seciliDonemKesimTarihi = new Date(y, m - 1, kesimGunu, 23, 59, 59);
  
  // 2. Ödemeler İçin Sınır: Kesim tarihinden itibaren 20 gün sonrası (kesim sonrası yapılan ödeme bu ekstreden düşülür)
  const ODEME_PENCERESI_GUN = 10;
  const odemeSonTarihi = new Date(seciliDonemKesimTarihi);
  odemeSonTarihi.setDate(odemeSonTarihi.getDate() + ODEME_PENCERESI_GUN);

  const allKartPayments = state.kartPayments.filter(p => normalizeTr(p.kartAdi||'') === normKart);

  let ekstreToplami = 0;   // Sadece döneme ait ekstre (Taksitler hariç)
  let kumulatifToplam = 0; // Tüm zamanların toplam borcu (Gelecek taksitler dahil)
  let hasCurrentPeriodActivity = false;
  
  let prevM = m - 1; let prevY = y;
  if(prevM === 0){ prevM = 12; prevY--; }
  const prevDateStr = prevY + '-' + String(prevM).padStart(2,'0') + '-' + String(kesimGunu).padStart(2,'0');

  for(const p of allKartPayments){
    const pDateStr = parseFullDateKey(p.tarih);
    if(!pDateStr || pDateStr === '9999-99-99') continue;
    
    const [py, pm, pd] = pDateStr.split('-').map(Number);
    const islemTarihi = new Date(py, pm - 1, pd, 12, 0, 0); 
    
    // KÜMÜLATİF HESAPLAMA (Tüm zamanlar, limitsiz)
    kumulatifToplam += p.tutar;
    
    // EKSTRE HESAPLAMASI
    if (p.tutar > 0) {
       if(islemTarihi <= seciliDonemKesimTarihi){
          ekstreToplami += p.tutar;
          if(pDateStr > prevDateStr) hasCurrentPeriodActivity = true;
       }
    } else {
       if(islemTarihi <= odemeSonTarihi){
          ekstreToplami += p.tutar;
          if(pDateStr > prevDateStr) hasCurrentPeriodActivity = true;
       }
    }
  }

  ekstreToplami = Math.round(ekstreToplami * 100) / 100;
  kumulatifToplam = Math.round(kumulatifToplam * 100) / 100;
  
  if(!hasCurrentPeriodActivity && ekstreToplami === 0 && kumulatifToplam === 0 && allKartPayments.length === 0) return null;
  
  const parts = monthKey.split('-');
  const kisaTarih = String(kesimGunu).padStart(2,'0') + '.' + String(parts[1]).padStart(2,'0') + '.' + parts[0];
  
  return { 
    tarih: kisaTarih, 
    ekstreTutar: ekstreToplami, 
    kumulatifTutar: kumulatifToplam 
  };
}

function parseImportBlockKart(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  for(const line of lines){
    let parts = line.split('\t').map(p => p.trim()).filter(p => p !== '');
    if(parts.length < 4){ parts = line.split(/\s{2,}/).map(p => p.trim()).filter(p => p !== ''); }
    let tarih='', aciklama='', tutar='', kartAdi='';
    if(parts.length >= 4){
      tarih = parts[0]; kartAdi = parts[parts.length-1]; tutar = parts[parts.length-2]; aciklama = parts.slice(1, parts.length-2).join(' ');
    } else if(parts.length === 3){
      tarih = parts[0]; aciklama = parts[1]; tutar = parts[2];
    } else continue;
    if(!tarih && !aciklama && !tutar) continue;
    rows.push({tarih, aciklama, tutar, kartAdi});
  }
  return rows;
}

function addMonthsToTarih(raw, monthsToAdd){
  const key = parseFullDateKey(raw);
  const m = key.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return raw;
  let y = +m[1], mo = +m[2], d = +m[3];
  mo += monthsToAdd;
  y += Math.floor((mo - 1) / 12);
  mo = ((mo - 1) % 12) + 1;
  const sonGun = new Date(y, mo, 0).getDate();
  if(d > sonGun) d = sonGun;
  return String(d).padStart(2,'0') + '.' + String(mo).padStart(2,'0') + '.' + y;
}

  if(rawLower === 'kartlar') return {name:'kartlar'};

  return {name:'ana'};
}

function monthLabel(key){

function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  while(m>12){m-=12; y++;}
  while(m<1){m+=12; y--;}
  return y + '-' + String(m).padStart(2,'0');
}

function renderOdeme(){
  const payments = state.payments;
  const wrap = el(`<div><div class="topbar"><button class="backbtn" id="backBtn">‹ Ana Sayfa</button></div><div class="content"></div></div>`);
  const content = wrap.querySelector('.content');

  const stickyBlock = el(`<div class="sticky-top-block">
    <div class="apt-title-row"><h2 class="serif">Ödeme Veri Girişi (Daire & Diğer)</h2></div>
    <div class="excel-paste-wrap">
      <textarea id="pasteArea" placeholder="Excel'den (Tarih | Açıklama | Tutar) verileri yapıştırın..."></textarea>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn success" id="processBtn" style="flex:1;">Verileri İşle ve Güncelle ✓</button>
        <button class="btn secondary" id="clearPasteBtn">Temizle</button>
      </div>
    </div>
    <div class="bulk-bar"><label><input type="checkbox" id="selectAllChk"> Tümünü Seç</label><button class="btn danger" id="deleteSelectedBtn">Seçilenleri Sil</button><button class="btn secondary" id="excelExportBtn" style="margin-left:auto;">Excel'e Aktar</button></div>
  </div>`);
  content.appendChild(stickyBlock);

  const tableWrap = el(`<div class="excel-wrap"><table class="excel-table"><thead><tr><th class="ex-chk"></th><th class="ex-tarih">Tarih</th><th>Açıklama</th><th class="ex-tutar">Tutar</th><th class="ex-ay">Ay</th><th class="ex-sil"></th></tr></thead><tbody id="payTbody"></tbody></table></div>`);
  content.appendChild(tableWrap);
  const tbody = tableWrap.querySelector('#payTbody');

  function renderList(){
    tbody.innerHTML = '';
    if(payments.length === 0){
      content.querySelectorAll('.empty').forEach(e => e.remove()); tableWrap.after(el(`<div class="empty">Henüz ödeme verisi yok.</div>`));
      tableWrap.style.display = 'none'; return;
    }
    content.querySelectorAll('.empty').forEach(e => e.remove()); tableWrap.style.display = '';
    payments.forEach((p, idx) => {
      const ayKey = parseAyKeyFromTarih(p.tarih);
      const ayEtiket = ayKey ? monthLabel(ayKey) : null;
      const row = el(`<tr data-idx="${idx}">
        <td class="ex-chk"><input type="checkbox" class="pay-chk" data-idx="${idx}"></td>
        <td class="ex-tarih"><input type="text" class="tarih-in" value="${escapeAttr(p.tarih)}"></td>
        <td><input type="text" class="aciklama-in" value="${escapeAttr(p.aciklama)}"></td>
        <td class="ex-tutar"><input type="text" class="tutar-in" value="${p.tutar ? p.tutar.toString().replace('.', ',') : ''}"></td>
        <td class="ex-ay ${ayEtiket ? '' : 'ex-ay-warn'}">${ayEtiket ? ayEtiket : '⚠'}</td>
        <td class="ex-sil"><button class="delbtn">✕</button></td>
      </tr>`);
      row.querySelector('.tarih-in').addEventListener('change', e => { 
        p.tarih = e.target.value; 
        sortPaymentsByDate(state.payments); 
        save(); renderList(); 
      });
      row.querySelector('.aciklama-in').addEventListener('change', e => { p.aciklama = e.target.value; save(); });
      row.querySelector('.tutar-in').addEventListener('change', e => { p.tutar = parseTutar(e.target.value); save(); });
      row.querySelector('.delbtn').addEventListener('click', () => { payments.splice(idx, 1); save(); renderList(); });
      tbody.appendChild(row);
    });
  }
  renderList();

  stickyBlock.querySelector('#selectAllChk').addEventListener('change', e => tbody.querySelectorAll('.pay-chk').forEach(c => c.checked = e.target.checked));
  stickyBlock.querySelector('#deleteSelectedBtn').onclick = () => {
    const chks = Array.from(tbody.querySelectorAll('.pay-chk:checked'));
    if(chks.length === 0){ alert('Seçim yapın.'); return; }
    if(confirm(`${chks.length} adet kayıt silinecek. Onaylıyor musunuz?`)){
      chks.map(c => parseInt(c.dataset.idx)).sort((a,b) => b - a).forEach(idx => payments.splice(idx, 1));
      save(); stickyBlock.querySelector('#selectAllChk').checked = false; renderList();
    }
  };

  wrap.querySelector('#backBtn').onclick = () => { window.location.hash = ''; };
  wrap.querySelector('#clearPasteBtn').onclick = () => { wrap.querySelector('#pasteArea').value=''; };
  wrap.querySelector('#processBtn').onclick = () => {
    const rawVal = wrap.querySelector('#pasteArea').value.trim();
    if(rawVal === ''){ alert('Veri girin.'); return; }
    const rows = parseImportBlock(rawVal);
    rows.forEach(r => payments.push({tarih: r.tarih, aciklama: r.aciklama, tutar: parseTutar(r.tutar)}));
    sortPaymentsByDate(state.payments); 
    wrap.querySelector('#pasteArea').value = ''; save(); renderList(); alert(`${rows.length} satır işlendi.`);
  };
  stickyBlock.querySelector('#excelExportBtn').onclick = () => {
    if(payments.length === 0){ alert('Aktarılacak veri yok.'); return; }
    const rows = payments.map(p => ({ Tarih: p.tarih, Açıklama: p.aciklama, Tutar: p.tutar||0 }));
    exportRowsToExcel(rows, 'Ödeme Havuzu', 'odeme-havuzu.xlsx');
  };
  return wrap;
}

      save(); stickyBlock.querySelector('#selectAllChk').checked = false; renderList();
    }
  };

  wrap.querySelector('#backBtn').onclick = () => { window.location.hash = ''; };

    if(state.kartlar.length === 0){ alert('Önce Kart Ayarları kısmından kart ekleyin.'); return; }
    const rows = parseImportBlockKart(rawVal);
    const kartAdMap = {}; state.kartlar.forEach(k => { kartAdMap[normalizeTr(k.ad)] = k.ad; });
    rows.forEach(r => payments.push({tarih: r.tarih, aciklama: r.aciklama, tutar: parseTutar(r.tutar), kartAdi: kartAdMap[normalizeTr(r.kartAdi)] || ''}));
    
    sortPaymentsByDate(state.kartPayments); 
    
    wrap.querySelector('#pasteArea').value = ''; save(); renderList(); alert(`${rows.length} satır işlendi.`);
  };

  stickyBlock.querySelector('#mkEkleBtn').onclick = () => {
    const tarih = stickyBlock.querySelector('#mkTarih').value.trim();
    const aciklama = stickyBlock.querySelector('#mkAciklama').value.trim();
    const tutarRaw = stickyBlock.querySelector('#mkTutar').value.trim();
    const kartAdi = stickyBlock.querySelector('#mkKart').value;
    let taksit = parseInt(stickyBlock.querySelector('#mkTaksit').value, 10) || 1;
    if(!tarih || !parseFullDateKey(tarih).match(/^\d{4}-\d{2}-\d{2}$/)){ alert('Geçerli tarih girin (örn. 15.06.2026).'); return; }
    if(!tutarRaw){ alert('Tutar girin.'); return; }
    if(!kartAdi){ alert('Kart seçin.'); return; }
    const tutar = parseTutar(tutarRaw);
    for(let i=0; i<taksit; i++){
      payments.push({tarih: i===0 ? tarih : addMonthsToTarih(tarih, i), aciklama: taksit > 1 ? `${aciklama} (${i+1}/${taksit}. taksit)` : aciklama, tutar: tutar, kartAdi});

    sortPaymentsByDate(state.kartPayments); 
    
    save(); renderList();
    stickyBlock.querySelector('#mkTarih').value = ''; stickyBlock.querySelector('#mkAciklama').value = ''; stickyBlock.querySelector('#mkTutar').value = ''; stickyBlock.querySelector('#mkTaksit').value = '1';
  };
  stickyBlock.querySelector('#excelExportBtn').onclick = () => {
    if(payments.length === 0){ alert('Aktarılacak veri yok.'); return; }
    const rows = payments.map(p => ({ Tarih: p.tarih, Açıklama: p.aciklama, Tutar: p.tutar||0, Kart: p.kartAdi||'' }));
    exportRowsToExcel(rows, 'Kart Havuzu', 'kart-havuzu.xlsx');
  };
  return wrap;
}

  const cloudSec = el(`<div class="settings-section">
    <h4>Cihazlar Arası Eşitleme (Firebase)</h4>
    <div class="hint" style="margin-bottom:10px;">${fbEnabled ? 'Bu cihaz Firebase\'e bağlı. Veriler her kayıtta otomatik olarak buluta gönderilir ve açılışta bulut daha güncelse otomatik indirilir.' : 'Firebase henüz yapılandırılmadı. Kod içindeki FIREBASE_CONFIG alanına kendi Firebase proje bilgilerinizi girmeniz gerekiyor.'}</div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;" id="syncBadge">${fbEnabled ? 'Durum bekleniyor…' : 'Bağlı değil'}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn secondary" id="cloudPushBtn" ${fbEnabled ? '' : 'disabled'}>Şimdi Buluta Gönder</button>
      <button class="btn secondary" id="cloudPullBtn" ${fbEnabled ? '' : 'disabled'}>Buluttan İndir (Bu Cihaza Uygula)</button>
    </div>
  </div>`);
  content.appendChild(cloudSec);
  cloudSec.querySelector('#cloudPushBtn').onclick = () => cloudPush();
  cloudSec.querySelector('#cloudPullBtn').onclick = () => { if(confirm('Buluttaki veri bu cihazdaki verinin üzerine yazılacak. Emin misiniz?')) cloudPullManual(); };

  const dataSec = el(`<div class="settings-section">
    <h4>Veri Yönetimi (Tüm Ayarlar ve Veriler)</h4>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn secondary" id="exportBtn">JSON Olarak Dışa Aktar</button>
      <label class="btn secondary filebtn" id="importLabel" style="cursor:pointer;">JSON Yükle
        <input type="file" accept="application/json" id="importFile" style="display:none;">
      </label>
    </div>
  </div>`);
  content.appendChild(dataSec);

  const kodSec = el(`<div class="settings-section">
    <h4>Daire Abone Numaraları (Excel)</h4>
    <div class="hint" style="margin-bottom:10px;">Tüm dairelerin Elektrik/Su/Doğalgaz abone kodlarını tek bir Excel dosyası olarak dışa aktarıp toplu kontrol edebilir, düzenledikten sonra aynı dosyayı tekrar içe aktararak güncelleyebilirsiniz.</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn secondary" id="kodExportBtn">Excel Olarak Dışa Aktar</button>
      <label class="btn secondary filebtn" id="kodImportLabel" style="cursor:pointer;">Excel Yükle
        <input type="file" accept=".xlsx,.xls" id="kodImportFile" style="display:none;">
      </label>
    </div>
  </div>`);
  content.appendChild(kodSec);

  kodSec.querySelector('#kodExportBtn').onclick = () => {
    const ids = Object.keys(state.apartments).sort((a,b) => Number(a)-Number(b));
    const rows = ids.map(id => {
      const apt = state.apartments[id];
      return {
        Daire_ID: id,
        Daire_Adi: apt.name,
        Elektrik_Kodlari: (apt.codes.elektrik||[]).join(', '),
        Su_Kodlari: (apt.codes.su||[]).join(', '),
        Dogalgaz_Kodlari: (apt.codes.dogalgaz||[]).join(', ')
      };
    });
    exportRowsToExcel(rows, 'Abone Kodları', 'daire-abone-kodlari.xlsx');
  };

  kodSec.querySelector('#kodImportFile').addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    readExcelFile(file, rows => {
      let guncellenen = 0;
      rows.forEach(r => {
        const idRaw = r.Daire_ID !== undefined ? String(r.Daire_ID).trim() : '';
        let apt = state.apartments[idRaw];
        if(!apt && r.Daire_Adi){
          const adNorm = normalizeTr(String(r.Daire_Adi));
          const found = Object.values(state.apartments).find(a => normalizeTr(a.name) === adNorm);
          if(found) apt = found;
        }
        if(!apt) return;
        apt.codes = apt.codes || {elektrik:[], su:[], dogalgaz:[]};
        apt.codes.elektrik = splitKodlar(r.Elektrik_Kodlari);
        apt.codes.su = splitKodlar(r.Su_Kodlari);
        apt.codes.dogalgaz = splitKodlar(r.Dogalgaz_Kodlari);
        guncellenen++;
      });
      save(); render();
      alert(`${guncellenen} daire güncellendi.`);
    });
    e.target.value = '';
  });

  dataSec.querySelector('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'bina-faturalari-tam-yedek.json';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
  dataSec.querySelector('#importFile').addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result); const fresh = defaultState();
        state = Object.assign(fresh, parsed, { apartments: Object.assign(fresh.apartments, parsed.apartments||{}), payments: parsed.payments || [], digerKalemler: parsed.digerKalemler || [], kartlar: parsed.kartlar || [], kartPayments: parsed.kartPayments || [] });
        
        sortPaymentsByDate(state.payments);
        sortPaymentsByDate(state.kartPayments);
        
        save(); applyTheme(); render();
      }catch(err){ alert('Geçersiz dosya.'); }
    };
    reader.readAsText(file);
  });

  wrap.querySelector('#backBtn').onclick = () => { window.location.hash = ''; };
  return wrap;
}
</script>
</body>
</html>
